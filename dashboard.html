<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MH Incorporadora — Acompanhamento de Dados</title><link rel="icon" href="favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--black:#111;--soft:#1a1815;--gold:#b88625;--light:#d9ad57;--cream:#f4f3f1;--dim:#c9c1b2;--line:rgba(244,243,241,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(65% 55% at 90% 0,rgba(184,134,37,.15),transparent 60%),var(--black);color:var(--cream);font-family:Oswald,sans-serif}.shell{max-width:1200px;margin:auto;padding:42px 24px 64px}.top{border-bottom:1px solid var(--line);padding-bottom:28px}.eyebrow,.label{color:var(--dim);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.eyebrow{color:var(--light)}h1{font:500 clamp(42px,6vw,68px)/.95 'Cormorant Garamond',serif;margin:10px 0}.sub{color:var(--dim);font-size:12px;letter-spacing:.09em;text-transform:uppercase}.period{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 20px}.period button,.date{font:500 12px Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--cream);background:transparent;border:1px solid var(--line);padding:10px 13px;cursor:pointer}.period button:hover,.period button.active{background:var(--gold);border-color:var(--gold);color:var(--black)}.custom{display:none;gap:8px}.custom.show{display:flex}.date{color-scheme:dark}.apply{background:var(--cream)!important;color:var(--black)!important;border-color:var(--cream)!important}.range{margin:0 0 26px;color:var(--dim);font:italic 18px 'Cormorant Garamond',serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.buttons{grid-template-columns:repeat(5,minmax(0,1fr))}.card{position:relative;overflow:hidden;padding:23px;background:linear-gradient(135deg,var(--soft),var(--black));border:1px solid var(--line)}.card:before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.metric{font:500 clamp(34px,5vw,54px) 'Cormorant Garamond',serif;margin:12px 0 4px}.button-card{min-height:160px}.button-card .metric{font-size:42px}.small,.change{font-size:12px;color:var(--dim)}.up{color:#d8bc75}.down{color:#dc8d79}.section{font:500 34px 'Cormorant Garamond',serif;margin:46px 0 16px}.chart-card{margin-top:16px}.chart{height:280px;display:flex;align-items:end;gap:clamp(10px,3vw,34px);padding:18px 8px 0;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;gap:8px}.bar-value,.bar-label{text-align:center;font-size:11px;color:var(--dim)}.bar-fill{min-height:2px;background:linear-gradient(var(--light),var(--gold));transition:height .4s}.notice{padding:22px;border:1px dashed var(--line);color:var(--dim);font:18px 'Cormorant Garamond',serif}.hidden{display:none!important}.skeleton{height:38px;width:62%;margin:13px 0;background:linear-gradient(90deg,#292622 25%,#403a30 45%,#292622 65%);background-size:300% 100%;animation:pulse 1.2s infinite}@keyframes pulse{to{background-position:-300% 0}}@media(max-width:780px){.shell{padding:28px 16px 46px}.grid,.buttons{grid-template-columns:1fr}.custom{width:100%}.date{min-width:0;flex:1}.chart{height:245px;gap:8px}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}.bar-fill{transition:none}}
</style></head><body><main class="shell"><header class="top"><div class="eyebrow">MH Incorporadora</div><h1>Acompanhamento de Dados</h1><div class="sub">Dados de interação do site</div></header><div class="period"><button data-p="today">Hoje</button><button data-p="yesterday">Ontem</button><button data-p="7">Últimos 7 dias</button><button class="active" data-p="30">Últimos 30 dias</button><button data-p="90">Últimos 90 dias</button><button data-p="custom">Período personalizado</button><span class="custom"><input id="start" class="date" type="date" aria-label="Data inicial"><input id="end" class="date" type="date" aria-label="Data final"><button id="apply" class="apply">Aplicar</button></span></div><p id="range" class="range"></p><div id="notice" class="notice hidden"></div><div id="content"><section class="grid"><article class="card"><div class="label">Visualizações de página</div><div id="views" class="metric"><i class="skeleton"></i></div><div id="views-change" class="change"></div></article><article class="card"><div class="label">Total de cliques</div><div id="clicks" class="metric"><i class="skeleton"></i></div><div id="clicks-change" class="change"></div></article></section><h2 class="section">Cliques nos principais botões</h2><section id="cards" class="grid buttons"></section><section class="card chart-card"><div class="label">Comparativo de cliques</div><div id="chart" class="chart"></div></section></div></main><script>
const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)],nf=new Intl.NumberFormat('pt-BR'),short={diamond:'Diamond','mirante-golden':'Mirante Golden','agende-visita':'Agende visita','whatsapp-equipe':'Equipe WhatsApp',obras:'Nossas obras'},iso=d=>d.toISOString().slice(0,10),add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},today=()=>{let d=new Date;return new Date(d.getFullYear(),d.getMonth(),d.getDate())};let range;
function choose(p){let e=today();range=p==='today'?{start:e,end:e}:p==='yesterday'?{start:add(e,-1),end:add(e,-1)}:{start:add(e,1-Number(p)),end:e};load()}function prev(){let n=Math.round((range.end-range.start)/864e5)+1;return{start:add(range.start,-n),end:add(range.start,-1)}}function msg(t){$('#notice').textContent=t;$('#notice').classList.remove('hidden')}function compare(a,b){if(!b)return a?'Sem dados no período anterior':'—';let p=Math.round((a-b)/b*100);return `<span class="${p>0?'up':p<0?'down':''}">${p>0?'+':''}${p}%</span> ${p>0?'aumento':p<0?'redução':'sem variação'} vs. período anterior`}
function loadState(){$('#notice').classList.add('hidden');$('#content').classList.remove('hidden');['views','clicks'].forEach(x=>$('#'+x).innerHTML='<i class="skeleton"></i>');$('#cards').innerHTML=Array(5).fill('<article class="card button-card"><i class="skeleton"></i><i class="skeleton"></i></article>').join('');$('#chart').innerHTML=''}function render(d){let total=d.totalClicks[0];$('#views').textContent=nf.format(d.pageViews[0]);$('#clicks').textContent=nf.format(total);$('#views-change').innerHTML=compare(...d.pageViews);$('#clicks-change').innerHTML=compare(...d.totalClicks);$('#cards').innerHTML=d.buttons.map(b=>`<article class="card button-card"><div class="label">${b.label}</div><div class="metric">${nf.format(b.current)}</div><div class="small">${total?((b.current/total)*100).toFixed(1).replace('.',','):0}% do total de cliques</div><div class="change">${compare(b.current,b.previous)}</div></article>`).join('');let max=Math.max(...d.buttons.map(b=>b.current),1);$('#chart').innerHTML=d.buttons.map(b=>`<div class="bar"><div class="bar-value">${nf.format(b.current)}</div><div class="bar-fill" style="height:${b.current/max*100}%"></div><div class="bar-label">${short[b.id]}</div></div>`).join('');if(!d.pageViews[0]&&!total)msg('Nenhum dado encontrado para o período selecionado.')}
async function load(){let p=prev(),o={day:'2-digit',month:'short',year:'numeric'};$('#range').textContent=`${range.start.toLocaleDateString('pt-BR',o)} — ${range.end.toLocaleDateString('pt-BR',o)}`;loadState();let q=new URLSearchParams({startDate:iso(range.start),endDate:iso(range.end),previousStartDate:iso(p.start),previousEndDate:iso(p.end)});try{let r=await fetch('/api/ga4?'+q),d=await r.json();if(!r.ok)throw Error(d.error);render(d)}catch(e){$('#content').classList.add('hidden');msg('Não foi possível carregar os dados do GA4. '+e.message)}}$$('[data-p]').forEach(b=>b.onclick=()=>{let c=b.dataset.p==='custom';$$('[data-p]').forEach(x=>x.classList.toggle('active',x===b));$('.custom').classList.toggle('show',c);if(!c)choose(b.dataset.p)});$('#apply').onclick=()=>{let s=$('#start').value,e=$('#end').value;if(!s||!e||s>e)return msg('Informe um intervalo de datas válido.');range={start:new Date(s+'T00:00:00'),end:new Date(e+'T00:00:00')};load()};choose('30');
</script></body></html>
