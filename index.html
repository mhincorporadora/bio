<style>
  :root{
    --black:#111111;
    --black-soft:#1a1815;
    --gold:#b88625;
    --gold-light:#d9ad57;
    --gold-deep:#7d5d1e;
    --cream:#f4f3f1;
    --cream-dim:#c9c1b2;
    --line: rgba(244,243,241,0.14);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--black);
    font-family:'Oswald', sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- ambient backdrop (visible mainly on desktop) ---------- */
  .backdrop{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(60% 50% at 82% 12%, rgba(184,134,37,0.16), transparent 60%),
      radial-gradient(50% 45% at 10% 92%, rgba(184,134,37,0.10), transparent 60%),
      var(--black);
  }
  .backdrop svg{
    position:absolute;
    opacity:0.5;
  }
  .backdrop .arc-big{
    width:1100px; height:1100px;
    right:-380px; top:-420px;
  }
  .backdrop .arc-small{
    width:640px; height:640px;
    left:-260px; bottom:-260px;
    opacity:0.35;
  }
  .backdrop .wordmark-watermark{
    position:absolute;
    right:6%;
    bottom:6%;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:22px;
    letter-spacing:0.08em;
    color:rgba(244,243,241,0.06);
  }

  /* ---------- card / device frame ---------- */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .frame-label{
    display:none;
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin-bottom:18px;
  }

  .card{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--black-soft), var(--black) 55%);
    border:1px solid var(--line);
    padding:44px 28px 32px;
    position:relative;
    overflow:hidden;
  }

  .card::before{
    /* thin gold hairline top */
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:3px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-light) 50%, var(--gold) 80%, transparent);
  }

  /* connecting arc motif echoing the MH logotype's bridge stroke */
  .arc-motif{
    position:absolute;
    top:-64px;
    left:50%;
    transform:translateX(-50%);
    width:280px;
    height:160px;
    opacity:0.9;
  }
  .arc-motif path{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-dasharray:340;
    stroke-dashoffset:340;
    animation:draw-arc 1.4s ease-out 0.15s forwards;
  }
  @keyframes draw-arc{ to{ stroke-dashoffset:0; } }

  .brand{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-bottom:34px;
  }

  .logo-real{
    width:190px;
    height:auto;
    color:var(--gold);
    margin-bottom:22px;
    opacity:0;
    animation:rise 0.6s ease-out 0.35s forwards;
  }
  .logo-real svg{ width:100%; height:auto; display:block; }

  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-size:19px;
    line-height:1.45;
    color:var(--cream-dim);
    max-width:300px;
    margin:0;
    opacity:0;
    animation:rise 0.6s ease-out 0.55s forwards;
  }
  .tagline em{
    font-style:italic;
    color:var(--gold-light);
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- links ---------- */
  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    text-decoration:none;
    border-radius:2px;
    opacity:0;
    animation:rise 0.55s ease-out forwards;
  }
  .links .btn:nth-child(1){ animation-delay:0.62s; }
  .links .btn:nth-child(2){ animation-delay:0.70s; }
  .links .btn:nth-child(3){ animation-delay:0.78s; }
  .links .btn:nth-child(4){ animation-delay:0.86s; }
  .links .btn:nth-child(5){ animation-delay:0.94s; }
  .links .btn:nth-child(6){ animation-delay:1.02s; }

  .btn .mark{
    flex:0 0 auto;
    width:8px;
    height:8px;
    margin-right:2px;
    transform:rotate(45deg);
    border:1.3px solid currentColor;
  }

  .btn .text{
    text-align:left;
  }
  .btn .title{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size:14.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
  }

  .btn .arrow{
    margin-left:auto;
    flex:0 0 auto;
    width:14px;
    height:14px;
    opacity:0.7;
    transition:transform 0.25s ease;
  }
  .btn:hover .arrow{ transform:translateX(3px); }

  .btn-primary{
    background:var(--cream);
    color:var(--black);
  }
  .btn-primary:hover{
    background:var(--gold-light);
  }

  .btn-outline{
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    transition:border-color 0.25s ease, background 0.25s ease;
  }
  .btn-outline .mark{ color:var(--gold-light); }
  .btn-outline:hover{
    border-color:var(--gold);
    background:rgba(184,134,37,0.08);
  }

  .btn:focus-visible{
    outline:2px solid var(--gold-light);
    outline-offset:2px;
  }

  /* ---------- footer ---------- */
  .card-footer{
    margin-top:32px;
    padding-top:20px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    opacity:0;
    animation:rise 0.55s ease-out 1.1s forwards;
  }
  .card-footer .loc{
    font-family:'Oswald', sans-serif;
    font-size:10.5px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--cream-dim);
  }
  .card-footer .dot{
    width:3px; height:3px;
    border-radius:50%;
    background:var(--gold);
  }
  .card-footer .brandtag{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    color:var(--gold-light);
  }

  /* ================= DESKTOP ================= */
  @media (min-width:681px){
    .frame-label{ display:block; }

    .card{
      border-radius:36px;
      padding:56px 40px 36px;
      box-shadow:
        0 40px 90px -30px rgba(0,0,0,0.85),
        0 0 0 8px rgba(244,243,241,0.03),
        0 0 0 9px var(--line);
    }

    .btn{ border-radius:6px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .arc-motif path{ stroke-dashoffset:0; }
    .monogram,.word,.tagline,.btn,.card-footer{ opacity:1; }
  }
</style>
